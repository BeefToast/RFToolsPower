name: Build RFToolsPower
on:
  workflow_dispatch:
  push:
    branches:
      - 1.21_neo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Build
        run: ./gradlew build --no-daemon -x test
      - name: Upload JAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rftoolspower-jars
          path: |
            **/build/libs/*.jar
            build/libs/*.jar
